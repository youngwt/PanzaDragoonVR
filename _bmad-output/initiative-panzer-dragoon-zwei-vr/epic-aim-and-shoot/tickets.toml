title = "A held button locks four cubes and releases homing lasers"
description = "Holding X on the left controller locks each cube the reticle crosses, up to four, each marked by a clone of the reticle that follows it; releasing X fires one homing laser at each lock that destroys it, with the lock-on rules in `game/Logic/` and tested, toward CAP-8."
