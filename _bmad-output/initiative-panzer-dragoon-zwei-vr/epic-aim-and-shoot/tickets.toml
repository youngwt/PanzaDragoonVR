title = "Six grey cubes corkscrew around the player"
description = "Six cubes, each carrying `e03.flyer` when the folder supplies it, fly corkscrew paths spread around the player in place of the one circling cube; each can be destroyed, when it disappears, and returns to its path a few seconds later, with the paths and the return in `game/Logic/` and tested, toward CAP-8."
