# The stories of this epic in build order. tickets.py reads this.

[[entry]]
id = 1
type = "story"
title = "The left controller aims a reticle"
description = "Tracer bullet: both controllers are in the scene in every mode, and the development mode's tuning list (backlog 21, `Main.TuningMenu.cs`) uses those two in place of making its own; a reticle sprite sits at a fixed, built-in distance from the player along the left controller's aim, as if on a sphere around them, toward CAP-6."
verify = "In the headset the reticle follows the left controller as the author sweeps it across the forest, the dragon and the circling cube, at a constant distance, at 90 Hz, and the tuning list still works in development mode; the author records milestone 4's clip of the sweep."
covers = ["CAP-6"]
after = ["1.3"]
hitl = true                 # headset check and the clip
risk = "low"

[[entry]]
id = 2
type = "story"
title = "A gun in the left hand"
description = "The game asks for the gun by a new ID, `rider.gun`, in `game/AssetIds.cs` and the asset contract (a new `rider.` prefix in the IDs table, five IDs asked for, a placeholder line, and a Models rule that a gun's origin is its grip, its barrel along +Z, in metres), and holds the folder's model in the left hand when it supplies one, else a grey gun built in code, turned so the barrel points along the aim, without hiding the tuning list's label in development mode, toward CAP-7."
verify = "In the headset the grey gun tracks the left controller and points at the reticle; a hand-made .glb pushed under `rider.gun` that follows the contract's rule replaces it, pointing the same way."
covers = ["CAP-7"]
after = [1]
hitl = true                 # headset check
risk = "low"

[[entry]]
id = 3
type = "story"
title = "The extractor writes the rider's gun"
description = "First the author picks, from a drawing kept under `extracted/`, which parts of the rider in `COMMON.MDB` make the gun (it may share a part with his hand); then the decoding library writes them as `models/rider_gun.glb`, root node `gun`, under `rider.gun`, posed to the contract's gun rule, byte-identical on the PC and the headset, with the contract's What-extraction-writes table and the extractor's version risen in every place AGENTS.md lists; a disc whose gun cannot be read still extracts, ending the extractor's line with `no gun: <reason>` and adding a launch-table row and board line as the floor and canopy and the dragons have, and the game shows the grey gun, toward CAP-7."
verify = "pdz-extract on both discs writes `rider_gun.glb`, which validate-gltf.sh passes and the author recognises in a glTF viewer; a test disc with no readable gun extracts with the notice; compare-headset.sh reports identical; in the headset the rider's gun is in the left hand pointing at the reticle, and the author records milestone 5's close-up clip."
covers = ["CAP-7"]
after = [2, "4.3", "4.5"]
hitl = true                 # the author picks the parts, checks the gun and records the clip
risk = "medium"

