[[entry]]
id = 9
type = "story"
title = "Shots sound from the gun"
description = "Each bolt plays a gunshot from the gun's position in 3D. A new `sound` kind, `.wav`, joins both asset rule sets (`tools/manifest.py` and `game/Logic/`) with a contents check and shared cases in `tests/fixtures/asset-rules/`, and the contract's Kinds table with the WAV subset it accepts (uncompressed PCM, its bit depths, channels and rates) and a rule for an invalid sound; the game asks for a new ID, `rider.gun_shot` in `game/AssetIds.cs` (six IDs asked for), plays the folder's sound when it supplies one, else a built-in royalty-free (CC0) gunshot under `game/` with its source and licence noted beside it; AGENTS.md and the contract's Placeholders rule change to allow that one off-the-shelf placeholder, on the author's word of 2026-11-14, toward CAP-8."
verify = "The asset-rule fixtures pass in both suites; in the headset every bolt sounds from the left hand, the built-in gunshot by default; a WAV in the contract's subset pushed under `rider.gun_shot` replaces it; holding the trigger keeps 90 Hz; the APK holds the built-in sound and no disc data."
covers = ["CAP-8"]
after = [3, 6, 7]           # 3: both edit AssetIds.cs and the contract's IDs; 7: both change the fire and input code in Main*.cs
hitl = true                 # headset listen
risk = "low"

[[entry]]
id = 10
type = "spike"
title = "Where the gunshot sound is on the disc"
description = "Finds how a `.SND` file holds its sounds (likely `COMMON.SND`, beside the rider), their sample format and rate, and which one is the gun's shot, by reading the files and, if needed, the game's code in Mednafen and Ghidra; the answer, with evidence, goes in zwei-disc-formats.md, toward CAP-8."
verify = "zwei-disc-formats.md describes the layout in a section of its own, each point marked confirmed or lead with evidence, and says whether the shot is a plain sample or a sound-driver voice (pitch, envelope) that would need the sound chip emulated, and so whether entry 11 is feasible as written; a throwaway script decodes the candidate to a WAV under `extracted/` and the author confirms by ear that it is the gun; entry 11's `unknown` is replaced by the answer."
covers = ["CAP-8"]
after = []
hitl = true                 # reverse engineering with the author; the author confirms by ear
risk = "high"
references = ["../spec-panzer-dragoon-zwei-vr/zwei-disc-formats.md"]

[[entry]]
