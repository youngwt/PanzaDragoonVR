type = "story"
title = "The extractor writes the gunshot"
description = "The decoding library decodes the gun's shot from the player's disc as `sounds/rider_gun_shot.wav` under `rider.gun_shot`, as uncompressed PCM within the contract's WAV subset, decoded with integer arithmetic only and no floating-point resampling so it is byte-identical on the PC and the headset, with the contract's What-extraction-writes table and the extractor's version risen in every place AGENTS.md lists; a disc whose sound cannot be read still extracts, ending the extractor's line with `no gunshot: <reason>`, and the game plays the built-in one, with a launch-table row and board line as the gun's in entry 3 has, toward CAP-8."
verify = "pdz-extract on both discs writes the WAV, which the author recognises by ear; Decoding.Tests build their own small `.SND` and check the decoded bytes and the failure notice; compare-headset.sh reports identical; in the headset the bolts sound with the disc's gunshot."
covers = ["CAP-8"]
after = [3, 9, 10]          # 3: both raise the extractor version and add rows to the contract's What-extraction-writes table
