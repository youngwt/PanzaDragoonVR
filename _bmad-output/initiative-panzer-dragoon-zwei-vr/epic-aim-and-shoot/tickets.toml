description = "Holding the left controller's top (index) trigger fires fast, visible bolts from the gun's grip along the aim, a few a second; the first cube a bolt touches is destroyed and returns later, with the fire rate and the bolt's hit engine-free in `game/Logic/` and tested, not Godot physics, toward CAP-8."
