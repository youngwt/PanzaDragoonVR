[[entry]]
id = 4
type = "story"
title = "Extraction writes the floor and canopy images"
description = "The decoding library extracts the floor and canopy planes found by spike 2 (cells, maps and colours) as repeating PNG images (the whole plane page as the disc holds it, unless spike 2 decided otherwise) under the asset contract's e03.floor and e03.canopy IDs, listed in the manifest, on the PC and the headset, toward CAP-3 and CAP-4."
verify = "pdz-extract on the author's disc writes e03.floor and e03.canopy PNGs that tile seamlessly and match the save state's planes by eye, with unit tests on synthetic plane data, and compare-headset.sh reports identical."
