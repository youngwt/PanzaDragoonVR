[[entry]]
id = 1
type = "story"
title = "The floor scrolls endlessly beneath the player in the headset"
description = "Tracer bullet: the ground plane's image scrolls past beneath the player at a steady speed and repeats with no visible seam, and the sky plane's image scrolls at the same on-screen speed as a flat backdrop, using whatever images the folder supplies or the placeholders, toward CAP-4."
verify = "In the headset the chequered placeholder floor and sky (or the author's own images) fly past continuously for a minute with no seam, jump or judder, at 90 Hz."
covers = ["CAP-4"]
after = [7, "1.4"]
hitl = true                 # headset check
risk = "medium"

[[entry]]
id = 2
type = "spike"
title = "Where the floor and canopy planes are on the disc"
description = "Finds where Episode 3's floor and canopy plane data come from on the disc (the 16x16 cells, the plane maps and their colours; a lead: colour codes 0x500 up, with the block at 0x600-0x6FF appearing in EPISODE3.PRG at 0x52C44), by tracing the save state's VDP2 data to the disc files and, if needed, the game's code in Mednafen and Ghidra; the answer, with evidence, goes in zwei-disc-formats.md, toward CAP-3 and CAP-4."
verify = "zwei-disc-formats.md names where the cells, maps and colours come from and how they are laid out, each marked confirmed or lead with evidence, or lists what was ruled out; the spec's open questions on the plane data and palette are updated; and the author has decided what story 4 does, including whether a plane image is the whole 512x512 page or its repeating pattern."
covers = ["CAP-3", "CAP-4"]
after = []
hitl = true                 # reverse engineering with the author; the author decides
risk = "high"
references = ["../spec-panzer-dragoon-zwei-vr/zwei-disc-formats.md"]

[[entry]]
id = 3
type = "story"
title = "Floor depth, canopy height and scrolling come from a tuning file"
description = "Adds a small tuning file to the asset folder, defined in the asset contract, holding floor depth, canopy height, scroll speed, how the canopy moves, and the metres one floor image and one canopy image cover; the game reads it at launch and falls back to built-in values on a missing or bad file, and the spec's Constraints line and the contract's 'Not in the contract' tuning line are reconciled to it, toward CAP-4."
verify = "Pushing an edited tuning file with adb and relaunching changes the floor's depth, the canopy's height and the scrolling in the headset; a broken file is reported on the launch board and the built-in values are used; the author has agreed the contract change."
covers = ["CAP-4"]
after = [1, "2.13"]
hitl = true                 # the author agrees the contract change; headset check
risk = "low"

