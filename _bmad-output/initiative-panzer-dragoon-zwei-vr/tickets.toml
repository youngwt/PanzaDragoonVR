# The epics in build order. tickets.py reads this.

[[epic]]
id = 1
slug = "epic-engine-spike"
title = "Engine spike on Quest 3"
covers = ["CAP-1", "CAP-2"]

[[epic]]
id = 2
slug = "epic-extraction-tool"
title = "Extraction tool"
covers = ["CAP-3"]
after = [{ epic = 1, needs = "the manifest format and folder layout" }]

[[epic]]
id = 3
slug = "epic-forest-floor-and-canopy"
title = "Forest floor and canopy"
covers = ["CAP-4", "CAP-3"]
after = [{ epic = 1, needs = "the runtime asset loader and the VR scene" }, { epic = 2, needs = "the extraction command that writes files and the manifest" }]

[[epic]]
id = 4
slug = "epic-riding-the-dragon"
title = "Riding the dragon"
covers = ["CAP-5", "CAP-3"]
after = [{ epic = 1, needs = "the standard model format and the runtime asset loader" }, { epic = 2, needs = "the extraction command and coloured textures" }]

[[epic]]
id = 5
slug = "epic-aim-and-shoot"
title = "Aim and shoot"
covers = ["CAP-6", "CAP-7", "CAP-8"]
after = [{ epic = 1, needs = "the VR scene with tracked controllers" }]

[[epic]]
id = 6
slug = "epic-real-enemies"
title = "Real enemies"
covers = ["CAP-9", "CAP-3"]
after = [{ epic = 4, needs = "model decoding in the tool and model loading in the game" }, { epic = 5, needs = "targets, lock-on and lasers" }]
